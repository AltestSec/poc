# ============================================================
# profiles.yml - DBT Connection Profiles
# Credentials injected via environment variables
# ============================================================

etl_runner:
  target: "{{ env_var('DBT_TARGET', 'prod') }}"
  
  outputs:
    prod:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: "{{ env_var('DBT_DB_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_DB_PORT', '1433') | int }}"
      database: "{{ env_var('DBT_DB_NAME', 'analytics') }}"
      schema: "{{ env_var('DBT_DB_SCHEMA', 'dbo') }}"
      
      # Authentication via Managed Identity (recommended for Azure)
      authentication: ActiveDirectoryMsi
      
      # Alternative: SQL authentication (uncomment if needed)
      # user: "{{ env_var('DBT_DB_USER') }}"
      # password: "{{ env_var('DBT_DB_PASSWORD') }}"
      
      # Connection settings
      encrypt: true
      trust_server_certificate: false
      retries: 3
      
    staging:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: "{{ env_var('DBT_DB_HOST_STAGING', 'localhost') }}"
      port: "{{ env_var('DBT_DB_PORT', '1433') | int }}"
      database: "{{ env_var('DBT_DB_NAME_STAGING', 'analytics_staging') }}"
      schema: "{{ env_var('DBT_DB_SCHEMA', 'dbo') }}"
      authentication: ActiveDirectoryMsi
      encrypt: true
      trust_server_certificate: false
      retries: 3
    
    dev:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: "{{ env_var('DBT_DB_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_DB_PORT', '1433') | int }}"
      database: "{{ env_var('DBT_DB_NAME', 'analytics_dev') }}"
      schema: "{{ env_var('DBT_DB_SCHEMA', 'dbo') }}"
      
      # Dev can use SQL auth for local testing
      user: "{{ env_var('DBT_DB_USER', 'dbt_user') }}"
      password: "{{ env_var('DBT_DB_PASSWORD', 'changeme') }}"
      
      encrypt: true
      trust_server_certificate: true
      retries: 1

# Notes:
# - Managed Identity (ActiveDirectoryMsi) is recommended for production
# - Environment variables are injected by Container App Job
# - For PostgreSQL, change type to 'postgres' and adjust connection params
# - For other databases, see: https://docs.getdbt.com/docs/supported-data-platforms
