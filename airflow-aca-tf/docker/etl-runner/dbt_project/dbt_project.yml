# ============================================================
# dbt_project.yml - DBT Project Configuration
# Minimal skeleton - customize for your data transformations
# ============================================================
name: 'etl_runner'
version: '1.0.0'
config-version: 2

# Project profile (references profiles.yml)
profile: 'etl_runner'

# Directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  etl_runner:
    # Staging models - views for initial data loading
    staging:
      +materialized: view
      +schema: staging
    
    # Mart models - tables for final analytics
    marts:
      +materialized: table
      +schema: marts

# Seeds configuration
seeds:
  etl_runner:
    +schema: seeds

# Snapshots configuration
snapshots:
  etl_runner:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at

# Variables (can be overridden via --vars)
vars:
  # Example: start_date: '2024-01-01'
  run_date: "{{ run_started_at.strftime('%Y-%m-%d') }}"
