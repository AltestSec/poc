parameters:
  serviceConnection: ''
  workingDirectory: ''
  tfvarsFile: ''
  owner: ''
  tfEnv: {}

steps:
  - task: TerraformTask@5
    displayName: 'Terraform destroy'
    inputs:
      provider: 'azurerm'
      command: 'destroy'
      workingDirectory: ${{ parameters.workingDirectory }}
      commandOptions: '-var-file=${{ parameters.tfvarsFile }} -var="owner=${{ parameters.owner }}"'
      environmentServiceNameAzureRM: ${{ parameters.serviceConnection }}
    env: ${{ parameters.tfEnv }}
