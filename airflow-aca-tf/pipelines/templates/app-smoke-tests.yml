parameters:
  serviceConnection: ''
  workingDirectory: ''
  envName: ''

steps:
  - task: AzureCLI@2
    displayName: 'CD: Smoke tests'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cd "${{ parameters.workingDirectory }}"
        
        RG_NAME="$(terraform output -raw resource_group_name)"
        ENV="${{ parameters.envName }}"
        
        echo "Checking provisioning states..."
        az containerapp show --name "airflow-${ENV}-scheduler" --resource-group "$RG_NAME" --query "properties.provisioningState" -o tsv
        az containerapp show --name "airflow-${ENV}-webserver" --resource-group "$RG_NAME" --query "properties.provisioningState" -o tsv
        
        echo "Checking webserver /health..."
        FQDN=$(az containerapp show --name "airflow-${ENV}-webserver" --resource-group "$RG_NAME" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
        if [ -n "$FQDN" ]; then
          curl -fsS --max-time 10 "https://${FQDN}/health" || true
        else
          echo "No FQDN (ingress disabled or still provisioning)"
        fi
