parameters:
  - name: serviceConnection
    type: string
  - name: imageTag
    type: string
    default: ''
  - name: dockerRoot
    type: string
  - name: buildId
    type: string
    default: '$(Build.BuildId)'

steps:
  - bash: |
      if [ -n "${{ parameters.imageTag }}" ]; then
        TAG="${{ parameters.imageTag }}"
      else
        TAG="$(Build.SourceVersion)"
        TAG="${TAG:0:8}"
      fi
      echo "##vso[task.setvariable variable=RESOLVED_TAG]$TAG"
    displayName: 'Resolve Image Tag'

  - task: AzureCLI@2
    displayName: 'Get ACR Name'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        if [ -z "${ACR_NAME:-}" ]; then
          echo "ACR_NAME variable must be set (Library variable/group)."
          exit 1
        fi
        echo "##vso[task.setvariable variable=ACR_NAME_RESOLVED]$ACR_NAME"

  # Create ACR Tasks YAML inline
  - bash: |
      cat > acr-task.yaml << 'EOF'
      version: v1.1.0
      steps:
        # Build both images concurrently
        - id: build-airflow
          build: >
            -t {{.Run.Registry}}/airflow:{{.Run.ID}}
            -t {{.Run.Registry}}/airflow:$TAG
            -t {{.Run.Registry}}/airflow:latest
            -f airflow/Dockerfile
            --platform linux/amd64
            airflow
          when: ["-"]

        - id: build-etl-runner
          build: >
            -t {{.Run.Registry}}/etl-runner:{{.Run.ID}}
            -t {{.Run.Registry}}/etl-runner:$TAG
            -t {{.Run.Registry}}/etl-runner:latest
            -f etl-runner/Dockerfile
            --platform linux/amd64
            etl-runner
          when: ["-"]

        # Push all images after successful builds
        - push:
            - "{{.Run.Registry}}/airflow:{{.Run.ID}}"
            - "{{.Run.Registry}}/airflow:$TAG"
            - "{{.Run.Registry}}/airflow:latest"
          when: ["build-airflow"]

        - push:
            - "{{.Run.Registry}}/etl-runner:{{.Run.ID}}"
            - "{{.Run.Registry}}/etl-runner:$TAG"
            - "{{.Run.Registry}}/etl-runner:latest"
          when: ["build-etl-runner"]
      EOF
    displayName: 'Create ACR Tasks YAML'

  # # Build and push both images using ACR Tasks
  # - task: AzureCLI@2
