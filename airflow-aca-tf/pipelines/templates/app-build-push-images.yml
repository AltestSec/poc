parameters:
  - name: serviceConnection
    type: string
  - name: imageTag
    type: string
    default: ''
  - name: dockerRoot
    type: string
  - name: buildId
    type: string
    default: '$(Build.BuildId)'

steps:
  - bash: |
      if [ -n "${{ parameters.imageTag }}" ]; then
        TAG="${{ parameters.imageTag }}"
      else
        TAG="$(Build.SourceVersion)"
        TAG="${TAG:0:8}"
      fi
      echo "##vso[task.setvariable variable=RESOLVED_TAG]$TAG"
    displayName: 'Resolve Image Tag'

  - task: AzureCLI@2
    displayName: 'Get ACR Name'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        if [ -z "${ACR_NAME:-}" ]; then
          echo "ACR_NAME variable must be set (Library variable/group)."
          exit 1
        fi
        echo "##vso[task.setvariable variable=ACR_NAME_RESOLVED]$ACR_NAME"

  # Build and push both images using ACR Tasks
  - task: AzureCLI@2
    displayName: 'Build and Push Images (ACR Tasks)'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az acr run \
          --registry $(ACR_NAME_RESOLVED) \
          --file $(System.DefaultWorkingDirectory)/pipelines/acr-tasks/build-all.yaml \
          --set TAG=$(RESOLVED_TAG) \
          --platform linux/amd64 \
          ${{ parameters.dockerRoot }}