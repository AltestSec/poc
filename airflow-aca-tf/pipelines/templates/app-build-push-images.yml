parameters:
  - name: serviceConnection
    type: string
  - name: imageTag
    type: string
    default: ''
  - name: dockerRoot
    type: string
  - name: buildId
    type: string
    default: '$(Build.BuildId)'

steps:
  - bash: |
      if [ -n "${{ parameters.imageTag }}" ]; then
        TAG="${{ parameters.imageTag }}"
      else
        TAG="$(Build.SourceVersion)"
        TAG="${TAG:0:8}"
      fi
      echo "##vso[task.setvariable variable=RESOLVED_TAG]$TAG"
    displayName: 'Resolve Image Tag'

  - task: AzureCLI@2
    displayName: 'Resolve ACR Login Server & Login'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        if [ -z "${ACR_NAME:-}" ]; then
          echo "ACR_NAME variable must be set (Library variable/group)."
          exit 1
        fi
        ACR_LOGIN_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
        az acr login --name "$ACR_NAME"
        echo "##vso[task.setvariable variable=ACR_LOGIN_SERVER]$ACR_LOGIN_SERVER"

  - task: Docker@2
    displayName: 'Build Airflow Image'
    inputs:
      command: build
      # No containerRegistry here - auth already handled by az acr login above
      buildContext: '${{ parameters.dockerRoot }}/airflow'
      dockerfile: '${{ parameters.dockerRoot }}/airflow/Dockerfile'
      repository: '$(ACR_LOGIN_SERVER)/airflow'
      tags: |
        $(RESOLVED_TAG)
        ${{ parameters.buildId }}
      arguments: '--platform linux/amd64'

  - task: Docker@2
    displayName: 'Push Airflow Image'
    inputs:
      command: push
      # No containerRegistry here - auth already handled by az acr login above
      repository: '$(ACR_LOGIN_SERVER)/airflow'
      tags: |
        $(RESOLVED_TAG)
        ${{ parameters.buildId }}

  - task: Docker@2
    displayName: 'Build ETL Runner Image'
    inputs:
      command: build
      buildContext: '${{ parameters.dockerRoot }}/etl-runner'
      dockerfile: '${{ parameters.dockerRoot }}/etl-runner/Dockerfile'
      repository: '$(ACR_LOGIN_SERVER)/etl-runner'
      tags: |
        $(RESOLVED_TAG)
        ${{ parameters.buildId }}
      arguments: '--platform linux/amd64'

  - task: Docker@2
    displayName: 'Push ETL Runner Image'
    inputs:
      command: push
      repository: '$(ACR_LOGIN_SERVER)/etl-runner'
      tags: |
        $(RESOLVED_TAG)
        ${{ parameters.buildId }}