parameters:
  serviceConnection: ''
  workingDirectory: ''
  tfvarsFile: ''
  owner: ''
  planOut: 'tfplan'
  tfEnv: {}

steps:
  - task: AzureCLI@2
    displayName: 'Terraform plan'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cd "${{ parameters.workingDirectory }}"
        
        run_plan () {
          terraform plan \
            -input=false \
            -lock-timeout=30s \
            -detailed-exitcode \
            -var-file="${{ parameters.tfvarsFile }}" \
            -var="owner=${{ parameters.owner }}" \
            -out="${{ parameters.planOut }}"
        }
        
        set +e
        OUT="$(run_plan 2>&1)"
        EC=$?
        set -e
        echo "$OUT"
        
        if [ $EC -eq 0 ] || [ $EC -eq 2 ]; then
          exit 0
        fi
        
        if echo "$OUT" | grep -q "state blob is already locked"; then
          LOCK_ID="$(echo "$OUT" | sed -n 's/^[[:space:]]*ID:[[:space:]]*//p' | head -n 1 | tr -d '\r')"
          echo "Lock detected: $LOCK_ID"
          terraform force-unlock -force "$LOCK_ID"
          echo "Retrying plan..."
          
          set +e
          OUT2="$(run_plan 2>&1)"
          EC2=$?
          set -e
          echo "$OUT2"
          
          if [ $EC2 -eq 0 ] || [ $EC2 -eq 2 ]; then
            exit 0
          fi
          exit $EC2
        fi
        
        exit $EC
    env: ${{ parameters.tfEnv }}
