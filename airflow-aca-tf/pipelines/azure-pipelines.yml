trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - airflow-aca-tf/terraform/**

parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'poc'
    values:
      - poc
      - prod
  - name: action
    displayName: 'Action'
    type: string
    default: 'plan'
    values:
      - plan
      - apply
      - destroy
  - name: owner
    displayName: 'Owner Email'
    type: string
    default: 'user@gmail.com'

variables:
  - name: terraformVersion
    value: '1.7.0'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/airflow-aca-tf/terraform'
  - group: ETL-TFSTATE-BACK
  - group: tags
  - name: ownerIF
    value: $[ coalesce(variables['owner'], '${{ parameters.owner }}') ]
  # - name: backendResourceGroup
  #   value: $[variables.backendResourceGroup]
  # - name: backendStorageAccount
  #   value: $[variables.backendStorageAccount]
  # - name: backendContainer
  #   value: $[variables.backendContainer]

stages:
  - stage: Validate
    displayName: 'Terraform Validate'
    jobs:
      - job: Validate
        displayName: 'Validate Terraform'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: 'Azure-ServiceConnection'
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: 'airflow-${{ parameters.environment }}.tfstate'

          - task: TerraformTask@5
            displayName: 'Terraform Validate'
            continueOnError: false
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: $(workingDirectory)
              environmentServiceNameAzureRM: 'Azure-ServiceConnection'

          - task: TerraformTask@5
            displayName: 'Terraform Format Check'
            continueOnError: false
            inputs:
              provider: 'azurerm'
              command: 'custom'
              customCommand: 'fmt'
              commandOptions: '-check -recursive'
              workingDirectory: $(workingDirectory)
              environmentServiceNameAzureRM: 'Azure-ServiceConnection'
              

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: 'Plan Infrastructure'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: 'Azure-ServiceConnection'
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: 'airflow-${{ parameters.environment }}.tfstate'

          # - task: TerraformTask@5
          #   displayName: 'Terraform Plan'
          #   inputs:
          #     provider: 'azurerm'
          #     command: 'plan'
          #     workingDirectory: $(workingDirectory)
          #     commandOptions: '-var-file=environments/${{ parameters.environment }}/terraform.tfvars -var="owner=$(ownerIF)" -out=tfplan'
          #     environmentServiceNameAzureRM: 'Azure-ServiceConnection'
          #   env:
          #     TF_VAR_airflow_fernet_key: $(AIRFLOW_FERNET_KEY)
          #     TF_VAR_airflow_webserver_secret_key: $(AIRFLOW_WEBSERVER_SECRET_KEY)
          #     TF_VAR_postgres_admin_password: $(POSTGRES_ADMIN_PASSWORD)
        # Pre-step: detect & remove stale state lock (Azure Blob backend)
          # - task: AzureCLI@2
          #   displayName: 'Pre: Unlock Terraform state if locked'
          #   inputs:
          #     azureSubscription: 'Azure-ServiceConnection'
          #     scriptType: bash
          #     scriptLocation: inlineScript
          #     inlineScript: |
          #       set -euo pipefail
          #       cd "$(workingDirectory)"

          #       # Ensure backend is configured (needed for force-unlock)
          #       terraform init -input=false -reconfigure \
          #         -backend-config="resource_group_name=$(backendResourceGroup)" \
          #         -backend-config="storage_account_name=$(backendStorageAccount)" \
          #         -backend-config="container_name=$(backendContainer)" \
          #         -backend-config="key=airflow-${{ parameters.environment }}.tfstate"

          #       # Read blob metadata to see if Terraform lock exists
          #       LOCK_ID=$(
          #         az storage blob metadata show \
          #           --account-name "$(backendStorageAccount)" \
          #           --container-name "$(backendContainer)" \
          #           --name "irflow-${{ parameters.environment }}.tfstate" \
          #           --auth-mode login \
          #           --query "metadata.terraformlockid" -o tsv 2>/dev/null || true
          #       )

          #       if [ -n "${LOCK_ID}" ] && [ "${LOCK_ID}" != "null" ]; then
          #         echo "State is locked. terraformlockid=${LOCK_ID}"
          #         echo "Attempting terraform force-unlock..."
          #         terraform force-unlock -force "${LOCK_ID}"
          #         echo "Unlocked."
          #       else
          #         echo "No terraform lock metadata found. Continuing."
          #       fi

          #   env:
          #     TF_IN_AUTOMATION: "true"

          - task: AzureCLI@2
            displayName: Terraform plan
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                cd $(workingDirectory)

                # Read blob metadata to see if Terraform lock exists
                LOCK_ID=$(
                  az storage blob metadata show \
                    --account-name "$(backendStorageAccount)" \
                    --container-name "$(backendContainer)" \
                    --name "irflow-${{ parameters.environment }}.tfstate" \
                    --auth-mode login \
                    --query "metadata.terraformlockid" -o tsv 2>/dev/null || true
                )

                if [ -n "${LOCK_ID}" ] && [ "${LOCK_ID}" != "null" ]; then
                  echo "State is locked. terraformlockid=${LOCK_ID}"
                  echo "Attempting terraform force-unlock..."
                  terraform force-unlock -force "${LOCK_ID}"
                  echo "Unlocked."
                else
                  echo "No terraform lock metadata found. Continuing."
                fi

                terraform init -input=false -reconfigure \
                  -backend-config="resource_group_name=$(backendResourceGroup)" \
                  -backend-config="storage_account_name=$(backendStorageAccount)" \
                  -backend-config="container_name=$(backendContainer)" \
                  -backend-config="key=airflow-${{ parameters.environment }}.tfstate"

                terraform plan \
                  -var-file="environments/${{ parameters.environment }}/terraform.tfvars" \
                  -var="owner=$(ownerIF)" \
                  -out=tfplan \
                  -detailed-exitcode

                    - task: PublishPipelineArtifact@1
                      displayName: 'Publish Plan'
                      inputs:
                        targetPath: '$(workingDirectory)/tfplan'
                        artifact: 'tfplan-${{ parameters.environment }}'
                        publishLocation: 'pipeline'

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    jobs:
      - deployment: Apply
        displayName: 'Apply Infrastructure'
        pool:
          vmImage: 'ubuntu-latest'
        environment: '${{ parameters.environment }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Plan'
                  inputs:
                    artifact: 'tfplan-${{ parameters.environment }}'
                    path: $(workingDirectory)

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: 'latest'

                - task: TerraformTask@5
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: $(workingDirectory)
                    backendServiceArm: 'Azure-ServiceConnection'
                    backendAzureRmResourceGroupName: $(backendResourceGroup)
                    backendAzureRmStorageAccountName: $(backendStorageAccount)
                    backendAzureRmContainerName: $(backendContainer)
                    backendAzureRmKey: 'airflow-${{ parameters.environment }}.tfstate'

                - task: TerraformTask@5
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: $(workingDirectory)
                    commandOptions: 'tfplan'
                    environmentServiceNameAzureRM: 'Azure-ServiceConnection'

                - task: Bash@3
                  displayName: 'Build and Push Airflow Image to ACR'
                  inputs:
                    targetType: 'inline'
                    script: |
                      ACR_NAME=$(terraform output -raw acr_login_server | cut -d'.' -f1)
                      az acr login --name $ACR_NAME
                      
                      cd $(System.DefaultWorkingDirectory)/airflow-aca/airflow
                      docker build -t $ACR_NAME.azurecr.io/airflow:$(Build.BuildId) .
                      docker push $ACR_NAME.azurecr.io/airflow:$(Build.BuildId)
                      
                      cd $(System.DefaultWorkingDirectory)/airflow-aca/airflow/etl-runner
                      docker build -t $ACR_NAME.azurecr.io/etl-runner:$(Build.BuildId) .
                      docker push $ACR_NAME.azurecr.io/etl-runner:$(Build.BuildId)
                    workingDirectory: $(workingDirectory)

  - stage: Destroy
    displayName: 'Terraform Destroy'
    dependsOn: Validate
    condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
    jobs:
      - job: Destroy
        displayName: 'Destroy Infrastructure'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: 'Azure-ServiceConnection'
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: 'airflow-${{ parameters.environment }}.tfstate'

          - task: TerraformTask@5
            displayName: 'Terraform Destroy'
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              workingDirectory: $(workingDirectory)
              commandOptions: '-var-file=environments/${{ parameters.environment }}/terraform.tfvars -var="owner=$(ownerIF)"'
              environmentServiceNameAzureRM: 'Azure-ServiceConnection'
            env:
              TF_VAR_airflow_fernet_key: $(AIRFLOW_FERNET_KEY)
              TF_VAR_airflow_webserver_secret_key: $(AIRFLOW_WEBSERVER_SECRET_KEY)
              TF_VAR_postgres_admin_password: $(POSTGRES_ADMIN_PASSWORD)
