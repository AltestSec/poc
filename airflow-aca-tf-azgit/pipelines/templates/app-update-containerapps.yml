parameters:
  serviceConnection: ''
  workingDirectory: ''
  envName: ''
  imageTag: ''  # if empty -> use current commit short SHA

steps:
  - task: AzureCLI@2
    displayName: 'CD: Update Container Apps Images'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cd "${{ parameters.workingDirectory }}"
        
        if [ -n "${{ parameters.imageTag }}" ]; then
          TAG="${{ parameters.imageTag }}"
        else
          TAG="$(Build.SourceVersion)"
          TAG="${TAG:0:8}"
        fi
        
        RG_NAME="$(terraform output -raw resource_group_name)"
        ACR_LOGIN_SERVER="$(terraform output -raw acr_login_server)"
        ENV="${{ parameters.envName }}"
        
        echo "Deploying tag: $TAG"
        
        az containerapp update --name "airflow-${ENV}-scheduler"  --resource-group "$RG_NAME" --image "$ACR_LOGIN_SERVER/airflow:$TAG" --output none
        az containerapp update --name "airflow-${ENV}-webserver"  --resource-group "$RG_NAME" --image "$ACR_LOGIN_SERVER/airflow:$TAG" --output none
        az containerapp update --name "airflow-${ENV}-worker"     --resource-group "$RG_NAME" --image "$ACR_LOGIN_SERVER/airflow:$TAG" --output none
        az containerapp update --name "airflow-${ENV}-triggerer"  --resource-group "$RG_NAME" --image "$ACR_LOGIN_SERVER/airflow:$TAG" --output none
        az containerapp job update --name "airflow-${ENV}-etl-runner" --resource-group "$RG_NAME" --image "$ACR_LOGIN_SERVER/etl-runner:$TAG" --output none
