trigger:
  branches:
    include: [ main, develop, feature/* ]
  paths:
    include:
      - airflow-aca-tf/docker/**
      - airflow-aca-tf/pipelines/**

parameters:
  # "checkboxes"
  - name: runBuild
    displayName: 'CI: Build & Push Docker Images'
    type: boolean
    default: true
  
  - name: runAppDeploy
    displayName: 'CD: Deploy Apps + DB migrations + Smoke tests'
    type: boolean
    default: false
  
  - name: runBusinessDbMigrations
    displayName: 'CD: Run Business DB migrations (your DB)'
    type: boolean
    default: false
  
  # environment controls
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'poc'
    values: [ poc, prod ]
  
  # app deploy controls
  - name: imageTag
    displayName: 'Image tag to deploy (e.g. 8-char commit SHA). Leave empty to use current commit SHA.'
    type: string
    default: ''

variables:
  - name: terraformVersion
    value: '1.7.0'
  - name: serviceConnection
    value: 'Azure-ServiceConnection'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/airflow-aca-tf/terraform'
  - name: dockerRoot
    value: '$(System.DefaultWorkingDirectory)/airflow-aca-tf/docker'
  - name: backendKey
    value: 'airflow-${{ parameters.environment }}.tfstate'
  - group: ETL-TFSTATE-BACK
  - group: tags
  - group: DB-VARS

stages:
  # ------------------------
  # CI: Build Images
  # ------------------------
  - stage: Build
    displayName: 'CI: Build & Push Images'
    condition: eq(${{ parameters.runBuild }}, true)
    jobs:
      - job: BuildPush
        pool: { vmImage: ubuntu-latest }
        steps:
          - checkout: self
          
          - template: templates/tf-install.yml
            parameters:
              terraformVersion: $(terraformVersion)
          
          # Build+push uses commit SHA short tag by default
          - template: templates/app-build-push-images.yml
            parameters:
              serviceConnection: $(serviceConnection)
              dockerRoot: $(dockerRoot)
              buildId: $(Build.BuildId)
              # Use current commit for tag unless user provided imageTag
              imageTag: ${{ coalesce(parameters.imageTag, '') }}

  # ------------------------
  # CD: App Deploy
  # ------------------------
  - stage: AppDeploy
    displayName: 'CD: Deploy Apps + DB migrations + Smoke tests'
    dependsOn: Build
    condition: eq(${{ parameters.runAppDeploy }}, true)
    jobs:
      - deployment: DeployApps
        environment: '${{ parameters.environment }}-apps'  # Requires approval in Azure DevOps
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                # Make sure terraform outputs are accessible (backend already exists)
                - template: templates/tf-install.yml
                  parameters: { terraformVersion: $(terraformVersion) }
                
                - template: templates/tf-init.yml
                  parameters:
                    serviceConnection: $(serviceConnection)
                    workingDirectory: $(workingDirectory)
                    backendResourceGroup: $(backendResourceGroup)
                    backendStorageAccount: $(backendStorageAccount)
                    backendContainer: $(backendContainer)
                    backendKey: $(backendKey)
                
                - template: templates/app-update-containerapps.yml
                  parameters:
                    serviceConnection: $(serviceConnection)
                    workingDirectory: $(workingDirectory)
                    envName: ${{ parameters.environment }}
                    imageTag: ${{ parameters.imageTag }}
                
                # Airflow metadata DB migrations (recommended, idempotent)
                - template: templates/app-airflow-db-migrate.yml
                  parameters:
                    serviceConnection: $(serviceConnection)
                    workingDirectory: $(workingDirectory)
                    envName: ${{ parameters.environment }}
                
                # Your "business" DB migrations (optional)
                - template: templates/app-business-db-migrate.yml
                  parameters:
                    enabled: ${{ parameters.runBusinessDbMigrations }}
                    serviceConnection: $(serviceConnection)
                    workingDirectory: $(workingDirectory)
                    envName: ${{ parameters.environment }}
                
                - template: templates/app-smoke-tests.yml
                  parameters:
                    serviceConnection: $(serviceConnection)
                    workingDirectory: $(workingDirectory)
                    envName: ${{ parameters.environment }}
